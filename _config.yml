# Настройки публикации на GitHub Pages (Jekyll собирает сайт сам при пуше).
#
# 1. Jekyll по умолчанию НЕ публикует папки и файлы, имя которых начинается с «_».
#    Сайту нужна папка _assets (стили, шрифты, 3D, библиотеки) - она включена явно.
# 2. Рабочие материалы не публикуются: документы передачи, отчёты, исходники модели,
#    лаборатория, служебные файлы. Они начинаются с «_» и уже скрыты, но перечислены ещё и
#    явно, чтобы правило не зависело от этой детали.
# 3. HTML-страницы без шапки «---» Jekyll копирует как есть, ничего в них не меняет.
#
# Не проверено локально: на компьютере передачи нет Ruby и Jekyll. Перед первой публикацией
# проверить на тестовой ветке, что /_assets/... открывается, а /_передача/ и /AGENTS.md отдают 404.
include:
  - _assets
exclude:
  - AGENTS.md
  - _config.yml
  - _передача
  - _отчёты
  - _3d
  - _lab
  - _дизайн
  - _каркас
  - _assets/_build-pages.mjs
  - _assets/_build-utility.mjs
  - _assets/_generate.mjs
  - _assets/_check-links.mjs
  - _assets/_launch-pages.mjs
  - _assets/_header-apply.mjs
  - _assets/_header-template.mjs
